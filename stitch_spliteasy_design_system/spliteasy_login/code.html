<!-- Simple Interactivity -->
<script>
        // Micro-interaction for the login button
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('mousedown', () => {
            loginBtn.classList.add('scale-[0.98]');
        });
        loginBtn.addEventListener('mouseup', () => {
            loginBtn.classList.remove('scale-[0.98]');
        });
        loginBtn.addEventListener('mouseleave', () => {
            loginBtn.classList.remove('scale-[0.98]');
        });

        // Floating effect for decor
        const decorBlobs = document.querySelectorAll('.lg\\:block');
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            decorBlobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                const x = (window.innerWidth / 2 - e.pageX) / speed;
                const y = (window.innerHeight / 2 - e.pageY) / speed;
                blob.style.transform = `translate(${x}px, ${y - (window.innerHeight/2)}px)`;
            });
        });
    </script>
