<h2 class="font-headline-sm text-headline-sm text-on-surface mb-lg">Create your account</h2>

</div>
</div>
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant block ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">mail</span>
<input class="w-full bg-white border border-outline/20 rounded-xl py-3.5 pl-12 pr-4 font-body-md text-body-md input-focus-effect transition-all placeholder:text-outline-variant" id="email" placeholder="name@example.com" type="email"/>
</div>

<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<p class="font-label-caps text-[10px] text-outline text-right mt-1">Must be at least 8 characters</p>
</div>

<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Password toggle logic
            const togglePass = document.querySelector('button[type="button"]');
            const passInput = document.getElementById('password');
            const icon = togglePass.querySelector('.material-symbols-outlined');

            togglePass.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                icon.textContent = isPass ? 'visibility' : 'visibility_off';
                
                // Add a little pop effect
                icon.style.transform = 'scale(1.2)';
                setTimeout(() => icon.style.transform = 'scale(1)', 150);
            });

            // Smooth entrance for form elements
            const fields = document.querySelectorAll('form > div');
            fields.forEach((field, index) => {
                field.style.opacity = '0';
                field.style.transform = 'translateY(10px)';
                field.style.transition = 'all 0.4s ease-out';
                field.style.transitionDelay = `${200 + (index * 50)}ms`;
                
                setTimeout(() => {
                    field.style.opacity = '1';
                    field.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
