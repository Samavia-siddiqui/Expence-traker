<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Expense - SplitEasy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#17e8a6",
                    "error": "#ba1a1a",
                    "surface": "#fcf9f8",
                    "surface-container": "#f0eded",
                    "primary-fixed": "#45ffbb",
                    "on-tertiary": "#ffffff",
                    "inverse-primary": "#00e2a0",
                    "surface-container-high": "#eae7e7",
                    "on-tertiary-fixed": "#291800",
                    "secondary": "#006b5d",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#002114",
                    "on-secondary-fixed": "#00201b",
                    "on-primary-container": "#006344",
                    "surface-dim": "#dcd9d9",
                    "on-background": "#1c1b1b",
                    "outline-variant": "#bacbbf",
                    "error-container": "#ffdad6",
                    "primary": "#006c4b",
                    "on-surface-variant": "#3b4a42",
                    "surface-bright": "#fcf9f8",
                    "tertiary-fixed-dim": "#ffb952",
                    "on-primary-fixed-variant": "#005138",
                    "inverse-on-surface": "#f3f0ef",
                    "tertiary-fixed": "#ffddb4",
                    "on-tertiary-fixed-variant": "#633f00",
                    "secondary-fixed": "#80f7e0",
                    "surface-container-highest": "#e5e2e1",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "secondary-container": "#80f7e0",
                    "on-surface": "#1c1b1b",
                    "secondary-fixed-dim": "#62dac4",
                    "background": "#fcf9f8",
                    "tertiary": "#825500",
                    "surface-tint": "#006c4b",
                    "on-primary": "#ffffff",
                    "tertiary-container": "#ffc16a",
                    "surface-variant": "#e5e2e1",
                    "on-error": "#ffffff",
                    "on-tertiary-container": "#784d00",
                    "outline": "#6b7b71",
                    "on-secondary-fixed-variant": "#005046",
                    "primary-fixed-dim": "#00e2a0",
                    "on-secondary-container": "#007163",
                    "inverse-surface": "#313030",
                    "surface-container-low": "#f6f3f2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "container-max": "1200px",
                    "sm": "12px",
                    "md": "24px",
                    "xl": "64px",
                    "base": "8px",
                    "xs": "4px",
                    "lg": "40px"
            },
            "fontFamily": {
                    "currency-display": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-caps": ["Inter"],

                    "body-lg": ["Inter"],

            },
            "fontSize": {
                    "currency-display": ["24px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #17e8a6 0%, #80f7e0 100%);
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }
        .blob-1 { top: -100px; right: -100px; }
        .blob-2 { bottom: -100px; left: -100px; }
        
        .expense-card {
            box-shadow: 0px 4px 20px rgba(26, 26, 26, 0.06);
        }
        .custom-checkbox:checked {
            background-color: #006c4b;
            border-color: #006c4b;
        }
    </style>
</head>
<body class="bg-background min-h-screen text-on-surface overflow-x-hidden">
<!-- Global Background Elements -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<!-- Top Navigation (Shell Implementation) -->
<header class="bg-surface/80 backdrop-blur-md dark:bg-inverse-surface/80 docked full-width top-0 sticky z-40 shadow-[0px_4px_20px_rgba(26,26,26,0.06)]">
<div class="flex justify-between items-center px-gutter py-md max-w-container-max mx-auto w-full">
<div class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed tracking-tight">SplitEasy</div>
<nav class="hidden md:flex items-center gap-xl">
<a class="text-on-surface-variant dark:text-surface-variant font-medium hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">Groups</a>
<a class="text-on-surface-variant dark:text-surface-variant font-medium hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">Activity</a>
<a class="text-on-surface-variant dark:text-surface-variant font-medium hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">Friends</a>
</nav>
<div class="flex items-center gap-md">
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors">Login</button>
<button class="bg-primary-container text-on-primary-container px-base py-xs rounded-lg font-label-caps text-label-caps font-bold hover:scale-[0.98] transition-transform">Sign Up</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-[1200px] mx-auto px-gutter py-lg flex flex-col items-center justify-center min-h-[calc(100vh-140px)]">
<!-- Add Expense Form Card -->
<section class="w-full max-w-2xl bg-surface-container-lowest rounded-xl p-md md:p-lg expense-card relative overflow-hidden">
<!-- Decorative accent line -->
<div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary-container to-secondary"></div>
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Add Expense</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Keep your group spending organized and transparent.</p>
</div>
<form class="space-y-xl" id="expense-form">
<!-- Top Row: Amount & Description -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-md items-start">
<div class="md:col-span-4 group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs ml-1">Amount</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-currency-display text-currency-display text-on-surface-variant">$</span>
<input class="w-full pl-8 pr-4 py-md bg-white border border-primary/20 rounded-xl focus:ring-0 focus:border-secondary font-currency-display text-currency-display transition-all outline-none" placeholder="0.00" required="" step="0.01" type="number"/>
</div>
</div>
<div class="md:col-span-8 group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs ml-1">Description</label>
<input class="w-full px-4 py-md bg-white border border-primary/20 rounded-xl focus:ring-0 focus:border-secondary font-body-lg text-body-lg transition-all outline-none" placeholder="e.g. Dinner at Mario's" required="" type="text"/>
</div>
</div>
<!-- Dropdown & Selectors -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-xl">
<!-- Paid By Dropdown -->
<div class="space-y-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1">Paid by</label>
<div class="relative">
<select class="w-full px-4 py-md bg-white border border-primary/20 rounded-xl appearance-none focus:ring-0 focus:border-secondary font-body-md text-body-md cursor-pointer">
<option value="me">Me</option>
<option value="john">John</option>
<option value="sarah">Sarah</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Split Among Checkboxes -->
<div class="space-y-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1">Split among</label>
<div class="bg-surface-container-low rounded-xl p-sm flex flex-wrap gap-md">
<label class="flex items-center gap-xs cursor-pointer group">
<input checked="" class="custom-checkbox w-5 h-5 rounded-lg border-primary/40 text-primary focus:ring-primary/20" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">All</span>
</label>
<label class="flex items-center gap-xs cursor-pointer group">
<input class="custom-checkbox w-5 h-5 rounded-lg border-primary/40 text-primary focus:ring-primary/20" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">John</span>
</label>
<label class="flex items-center gap-xs cursor-pointer group">
<input class="custom-checkbox w-5 h-5 rounded-lg border-primary/40 text-primary focus:ring-primary/20" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Sarah</span>
</label>
</div>
</div>
</div>
<!-- Receipt Placeholder/Context -->
<div class="flex items-center gap-md p-md bg-surface-container-high/30 rounded-xl border border-dashed border-outline-variant">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">receipt_long</span>
</div>
<div class="flex-1">
<p class="font-label-caps text-label-caps text-on-surface-variant">Optional</p>
<p class="font-body-md text-body-md text-on-surface">Tap to attach a receipt or photo</p>
</div>
<button class="text-primary hover:bg-primary/10 p-2 rounded-full transition-colors" type="button">
<span class="material-symbols-outlined">add_a_photo</span>
</button>
</div>
<!-- Action Buttons -->
<div class="flex flex-col-reverse md:flex-row items-center justify-end gap-md pt-md">
<button class="w-full md:w-auto px-xl py-sm font-label-caps text-label-caps text-on-surface-variant hover:text-error transition-colors text-center" type="button">
                        Cancel
                    </button>
<button class="w-full md:w-auto bg-primary-container text-[#1a1a1a] px-xl py-sm rounded-xl font-label-caps text-label-caps font-bold hover:shadow-lg hover:translate-y-[-2px] active:scale-[0.98] transition-all flex items-center justify-center gap-base" type="submit">
                        Add Expense
                        <span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</form>
</section>
<!-- Illustration / Marketing Context (Desktop Only) -->
<aside class="hidden xl:flex absolute right-gutter top-1/2 -translate-y-1/2 w-80 flex-col gap-md pointer-events-none opacity-40">
<div class="bg-surface-container rounded-xl p-md expense-card rotate-3 scale-90 border border-outline-variant/20">
<div class="flex justify-between mb-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container"></div>
<div class="space-y-xs flex-1 ml-sm">
<div class="h-3 w-3/4 bg-on-surface/10 rounded"></div>
<div class="h-2 w-1/2 bg-on-surface/5 rounded"></div>
</div>
</div>
<div class="h-6 w-full bg-primary-container/20 rounded"></div>
</div>
<div class="bg-surface-container rounded-xl p-md expense-card -rotate-2 border border-outline-variant/20">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">verified</span>
<div class="h-3 w-1/2 bg-on-surface/10 rounded"></div>
</div>
</div>
</aside>
</main>
<!-- Bottom Navigation (Mobile Implementation) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-sm pb-base md:hidden bg-surface shadow-[0px_-4px_20px_rgba(26,26,26,0.06)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-container-high" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label-caps text-label-caps">Groups</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-container-high" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-caps text-label-caps">Activity</span>
</a>
<!-- Active Tab: "Friends" or Contextual "Add" (Heuristic: Add is the intent) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-2 scale-[0.95] transition-all" href="#">
<span class="material-symbols-outlined">add</span>
<span class="font-label-caps text-label-caps">New</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-container-high" href="#">
<span class="material-symbols-outlined">account_circle</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<script>
        // Micro-interactions
        document.getElementById('expense-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Adding...';
            btn.disabled = true;
            btn.classList.add('opacity-80');

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success!';
                btn.classList.replace('bg-primary-container', 'bg-secondary');
                btn.classList.replace('text-[#1a1a1a]', 'text-white');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-secondary', 'bg-primary-container');
                    btn.classList.replace('text-white', 'text-[#1a1a1a]');
                    btn.disabled = false;
                    btn.classList.remove('opacity-80');
                    e.target.reset();
                }, 2000);
            }, 1200);
        });

        // Floating blobs parallax effect
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.blob');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body></html>
